name: Monthly Link Check

on:
  schedule:
    # 毎月1日 20:00 UTC = 翌日 05:00 JST。掲載団体URLの死活を月次で棚卸しする。
    - cron: '0 20 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '書き込まず対象表示のみ(--write を付けない)'
        type: boolean
        default: false

# 重複起動を防ぐ(死活チェックは時間がかかるため後続はキャンセルせず待たせない)
concurrency:
  group: linkcheck
  cancel-in-progress: false

# create-pull-request がブランチ push / PR 作成するために必要
permissions:
  contents: write
  pull-requests: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      # PR 先(develop)のデータに対して反映するため、develop を明示チェックアウト。
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: pip install -r scripts/enrichment/requirements.txt

      - name: Check URL liveness
        run: python3 scripts/enrichment/02_check_urls.py

      - name: Apply liveness results (link_broken / last_verified only)
        run: |
          python3 scripts/enrichment/linkcheck_apply.py \
            ${{ inputs.dry_run && '' || '--write' }} | tee /tmp/linkcheck_apply.log

      # リンク切れ確定分と「判定不能・要目視」分をジョブサマリとPR本文に出す。
      # 判定不能(blocked/unstable/review)は org JSON を変更していないので、
      # 人が確認して必要なら manual_overrides.json で確定させる。
      - name: Build review summary
        run: python3 scripts/enrichment/linkcheck_report.py /tmp/linkcheck_apply.log /tmp/pr_body.md

      - name: Validate data
        run: |
          node scripts/validate_data.mjs

      # 差分があれば PR を自動作成する。⚠️ 自動 commit / merge はしない
      # (リンク切れ→非掲載は編集判断。必ず人がレビューしてからマージする)。
      - name: Create Pull Request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/linkcheck
          base: develop
          commit-message: 'chore: 月次リンクチェック反映 (link_broken / last_verified)'
          title: '月次リンクチェック: 死活・最終確認日の更新'
          body-path: /tmp/pr_body.md
          labels: |
            automated
            data
